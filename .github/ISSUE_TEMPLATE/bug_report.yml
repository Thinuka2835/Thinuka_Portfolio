name: Bug report
description: Something on the site or in the admin doesn't work as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems must not be reported here** — see SECURITY.md for the private process.
        Please don't include passwords, tokens, personal data or the admin URL in this issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Contact form
        - Admin panel
        - Content / Markdown
        - Images / media
        - Build or deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The public page where it happens (if any).
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Dark
        - Light
        - Both / not relevant
  - type: input
    id: environment
    attributes:
      label: Browser, device and screen size
      placeholder: e.g. Safari 18 on iPhone 15, 390px wide
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or other context
